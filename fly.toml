# Kinetic — configuração do Fly.io
# Troque "kinetic-SEUNOME" por um nome único (nomes no Fly são globais).
app = "kinetic-SEUNOME"
primary_region = "gru"  # São Paulo — mais perto do Brasil

[build]

[env]
  NODE_ENV = "production"
  PORT = "3000"
  # DATABASE_URL (Postgres/Neon) e ADMIN_* devem ser definidos como secrets:
  #   fly secrets set DATABASE_URL="postgresql://..." ADMIN_EMAIL="..." ADMIN_PASSWORD="..."

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
